services:
  app:
    build: .
    container_name: forum15-app
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - DB_HOST=db
      - DB_USER=forum_user
      - DB_PASSWORD=forum_password
      - DB_NAME=forum_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: forum15-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: forum_db
      MYSQL_USER: forum_user
      MYSQL_PASSWORD: forum_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: forum15-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword

  nginx:
    image: nginx:1.27-alpine
    container_name: forum15-nginx
    restart: always
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  db_data:
